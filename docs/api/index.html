mples": [0.5405] }, "is_value_bet": { "anyOf": [{ "type": "boolean" }, { "type": "null" }], "title": "Is Value Bet", "description": "True when the model probability is higher than the implied probability.", "examples": [true] } }, "type": "object", "required": ["probability", "implied_probability"], "title": "OddsPredictionResponse", "description": "Response from HomeNoLose prediction." } } }, "servers": [{ "url": "http://localhost:8080", "description": "Local server" }] },
