services:
    db:
        image: mysql:9.7.4
        restart: always
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_ROOT_PASSWORD: ${YOUR_PASSWORD}
            MYSQL_DATABASE: ${YOUR_DB_NAME}
        ports:
            - '127.0.0.1:3307:3306'
        volumes:
            - mysql_data:/var/lib/mysql
        deploy:
            resources:
                limits:
                    memory: 0.5g
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${YOUR_PASSWORD}']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 60s

    backend:
        build: ./backend
        restart: unless-stopped
        environment:
            YOUR_HOST: db
            YOUR_PORT: 3306
            YOUR_USER: ${YOUR_USER}
            YOUR_PASSWORD: ${YOUR_PASSWORD}
            YOUR_DB_NAME: ${YOUR_DB_NAME}
        ports:
            - '8080:8080'
        volumes:
            - ./backend:/app
        deploy:
            resources:
                limits:
                    memory: 0.5g
        depends_on:
            db:
                condition: service_healthy

    web:
        build: ./frontend
        restart: unless-stopped
        ports:
            - '5173:5173'
        volumes:
            - ./frontend:/app
            - /app/node_modules
        environment:
            CHOKIDAR_USEPOLLING: 'true'
            VITE_API_URL: http://localhost:8080
        deploy:
            resources:
                limits:
                    memory: 0.5g
        depends_on:
            - backend

volumes:
    mysql_data:
